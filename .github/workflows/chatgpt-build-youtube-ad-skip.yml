name: Build YouTube Ad Skip Assistant

on:
  push:
    branches:
      - chatgpt-youtube-ad-skip-build-20260914

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yt-ad-skip-assistant

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/YouTube-Ad-Skip-Assistant.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YouTube-Ad-Skip-Assistant-APK
          path: yt-ad-skip-assistant/dist/YouTube-Ad-Skip-Assistant.apk
          if-no-files-found: error
