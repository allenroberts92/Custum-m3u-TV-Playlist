name: Build MediaConvert APK

on:
  push:
    branches: [ mediaconvert-build ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore MainActivity source
        run: |
          mkdir -p app/src/main/java/com/openai/mediaconvert
          cat buildparts/MainActivity.b64.* | base64 --decode > app/src/main/java/com/openai/mediaconvert/MainActivity.java
          sed -i 's/new ew TextView/new TextView/' app/src/main/java/com/openai/mediaconvert/MainActivity.java
          test -s app/src/main/java/com/openai/mediaconvert/MainActivity.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MediaConvert-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
