name: Build MSCE Android Launcher APK

on:
  push:
    branches:
      - build/moonscraper-android-launcher
    paths:
      - android-build/moonscraper-launcher/**
      - .github/workflows/build-msce-android-launcher.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Download exact official Moonscraper 1.5.13 Win64 installer
        working-directory: android-build/moonscraper-launcher
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 --retry-delay 2 \
            -o app/src/main/assets/MSCE.1.5.13.Installer.Win64.exe \
            'https://github.com/FireFox2000000/Moonscraper-Chart-Editor/releases/download/1.5.13/MSCE.1.5.13.Installer.Win64.exe'
          echo '30c5d0070cdfca7dc7b0f1c973468b12995ff3e14685a1308790257aa030fefe  app/src/main/assets/MSCE.1.5.13.Installer.Win64.exe' | sha256sum -c -

      - name: Build debug APK
        working-directory: android-build/moonscraper-launcher
        run: gradle --no-daemon :app:assembleDebug

      - name: Show APK checksum
        working-directory: android-build/moonscraper-launcher
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MSCE-Android-Launcher-1.0
          path: android-build/moonscraper-launcher/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
